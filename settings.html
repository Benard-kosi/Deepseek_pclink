<!DOCTYPE html>
<html>
<head>
 <title>PC Link Settings</title>
 <style>
 body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
 h2 { color: #4daafc; }
 label { display: flex; align-items: center; margin: 15px 0; font-size: 16px; cursor: pointer; }
 input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); }
 textarea { width: 100%; height: 80px; background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 4px; font-family: monospace; }
 button { background: #4daafc; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
 button:hover { background: #3b8bce; }
 </style>
</head>
<body>
 <h2>Settings</h2>
 
 <label>
 <input type="checkbox" id="autoAllow"> 
 Auto-Allow Commands (Skips the popup!)
 </label>

 <div style="margin-top: 20px;">
 <label style="display:block; margin-bottom: 5px;">Allowed Shell Commands (comma separated):</label>
 <textarea id="allowlist"></textarea>
 </div>

 <button onclick="saveSettings()">Save Settings</button>
 <p id="status" style="color: #4caf50; display: none;">Saved successfully!</p>

 <script>
 const { ipcRenderer } = require('electron');
 
 ipcRenderer.on('load-settings', (event, config) => {
 document.getElementById('autoAllow').checked = config.autoAllow;
 document.getElementById('allowlist').value = config.allowlist.join(', ');
 });

 function saveSettings() {
 const config = {
 autoAllow: document.getElementById('autoAllow').checked,
 allowlist: document.getElementById('allowlist').value.split(',').map(s => s.trim()).filter(Boolean)
 };
 ipcRenderer.send('save-settings', config);
 document.getElementById('status').style.display = 'block';
 setTimeout(() => { document.getElementById('status').style.display = 'none'; }, 2000);
 }
 </script>
</body>
</html>
